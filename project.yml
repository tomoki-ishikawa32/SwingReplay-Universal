name: SwingReplayApps
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SwingReplayCore:
    path: .
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tomoki.swingreplay
    SWIFT_VERSION: 6.0
targets:
  SwingReplay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/SwingReplay
      - path: Apps/SwingReplayPhone
        excludes:
          - SwingReplayPhoneApp.swift
      - path: Apps/SwingReplayPad
        excludes:
          - SwingReplayPadApp.swift
    info:
      path: Config/SwingReplay-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomoki.swingreplay
        TARGETED_DEVICE_FAMILY: 1,2
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    dependencies:
      - package: SwingReplayCore
        product: SwingReplayCore

schemes:
  SwingReplay:
    build:
      targets:
        SwingReplay: all
    run:
      config: Debug
    test:
      config: Debug
